name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # The pi devDependencies pin the compile baseline POST-migration (1.0.4), so the `build`
  # job above is what guards the modelRegistry -> modelRuntime world: PR #152's
  # isolated-provider test (test/e2e/isolated-provider.e2e.test.ts) skips itself on
  # pre-migration Pi and now actually runs there.
  #
  # This job covers the other end: the earliest Pi the peerDependencies claim (`>=1.0.0`).
  # It is NOT continue-on-error — a green run here is the only evidence behind that range,
  # and if the floor genuinely can't be supported any more, the peer range is what should
  # change. That is what moved it three times. 0.80.0 -> 0.81.0: pi only began folding
  # `toolResult.usage` into `getSessionStats()` in 0.81.0, and the `reportUsage` setting is
  # built on that, so every 0.80.x would have carried a setting that silently did nothing.
  # 0.81.0 -> 0.84.0: the Workflow tool needs two APIs that did not exist at the old floor —
  # `constrainedSampling` on `ToolDefinition` (0.82.0), which is how a schema-bearing agent
  # is forced to call `StructuredOutput`, and pi-tui's `stripTerminalSequences` (0.84.0),
  # which the workflow card and inspector use to strip the resets `truncateToWidth` injects.
  # Both are typecheck failures at 0.81.0, not soft degradations, so the range had to move.
  # 0.84.0 -> 1.0.0: the mention clone seeds its conversation through the session manager,
  # which only became what requests are built from in 0.87.0 (`agent.state` is read-only
  # since), and hands the Agent handler an `ExtensionToolContext`, added in 0.99.0.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@1.0.0 @earendil-works/pi-ai@1.0.0 @earendil-works/pi-tui@1.0.0
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot

  # Forward canary: reinstall whatever Pi is `latest` over the pin, so a release newer than
  # the baseline surfaces here before it reaches users. It runs the full typecheck + suite,
  # not a hand-picked file list, so new drift can't hide in a test nobody remembered to add
  # here. Both steps pass as of the 1.0.4 baseline — a failure IS fresh breakage.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
